[package]
name = "code-snippet-library"
version = "1.13.0"
description = "An offline Java, Python and C# snippet workbench"
authors = ["Code Snippet Library contributors"]
edition = "2021"

[lib]
name = "code_snippet_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
include_dir = "0.7"
tempfile = "3"
rfd = "0.15"

